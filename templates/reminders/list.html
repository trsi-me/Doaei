{% extends "base.html" %}

{% block title %}التذكيرات - دوائي{% endblock %}

{% block content %}
<div class="reminders-container">
    <div class="page-header">
        <h1><i class="fas fa-bell"></i> التذكيرات</h1>
        <p>إدارة تذكيرات الأدوية والمواعيد الطبية</p>
    </div>

    <div class="reminders-content">
        <div class="reminders-filters">
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all">
                    <i class="fas fa-list"></i> جميع التذكيرات
                </button>
                <button class="filter-tab" data-filter="today">
                    <i class="fas fa-calendar-day"></i> اليوم
                </button>
                <button class="filter-tab" data-filter="upcoming">
                    <i class="fas fa-clock"></i> القادمة
                </button>
                <button class="filter-tab" data-filter="overdue">
                    <i class="fas fa-exclamation-triangle"></i> المتأخرة
                </button>
            </div>

            <div class="filter-controls">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="البحث في التذكيرات...">
                </div>
                <button class="btn-add" onclick="showAddReminderModal()">
                    <i class="fas fa-plus"></i> إضافة تذكير
                </button>
            </div>
        </div>

        <div class="reminders-list" id="remindersList">
            <!-- سيتم تحميل التذكيرات هنا -->
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon">
                <i class="fas fa-bell-slash"></i>
            </div>
            <h3>لا توجد تذكيرات</h3>
            <p>لم يتم العثور على أي تذكيرات مطابقة للبحث</p>
            <button class="btn-primary" onclick="showAddReminderModal()">
                <i class="fas fa-plus"></i> إضافة تذكير جديد
            </button>
        </div>
    </div>
</div>

<!-- Modal إضافة تذكير -->
<div class="modal" id="addReminderModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-plus"></i> إضافة تذكير جديد</h3>
            <button class="modal-close" onclick="closeAddReminderModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <form id="addReminderForm" class="modal-body">
            <div class="form-group">
                <label for="medication_id" class="form-label">
                    <i class="fas fa-pills"></i> الدواء
                </label>
                <select name="medication_id" id="medication_id" class="form-input" required>
                    <option value="">اختر الدواء</option>
                    <!-- سيتم تحميل الأدوية هنا -->
                </select>
            </div>

            <div class="form-group">
                <label for="reminder_type" class="form-label">
                    <i class="fas fa-bell"></i> نوع التذكير
                </label>
                <select name="reminder_type" id="reminder_type" class="form-input" required>
                    <option value="medication">تذكير دواء</option>
                    <option value="appointment">موعد طبي</option>
                    <option value="checkup">فحص دوري</option>
                    <option value="refill">تجديد وصفة</option>
                </select>
            </div>

            <div class="form-group">
                <label for="reminder_time" class="form-label">
                    <i class="fas fa-clock"></i> وقت التذكير
                </label>
                <input type="datetime-local" name="reminder_time" id="reminder_time" class="form-input" required>
            </div>

            <div class="form-group">
                <label for="reminder_frequency" class="form-label">
                    <i class="fas fa-repeat"></i> التكرار
                </label>
                <select name="reminder_frequency" id="reminder_frequency" class="form-input">
                    <option value="once">مرة واحدة</option>
                    <option value="daily">يومياً</option>
                    <option value="weekly">أسبوعياً</option>
                    <option value="monthly">شهرياً</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notification_methods" class="form-label">
                    <i class="fas fa-bell"></i> طرق الإشعار
                </label>
                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" name="notification_methods" value="in_app" checked>
                        <span class="checkmark"></span>
                        <i class="fas fa-mobile-alt"></i> داخل التطبيق
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" name="notification_methods" value="email">
                        <span class="checkmark"></span>
                        <i class="fas fa-envelope"></i> البريد الإلكتروني
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" name="notification_methods" value="sms">
                        <span class="checkmark"></span>
                        <i class="fas fa-sms"></i> الرسائل النصية
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="notes" class="form-label">
                    <i class="fas fa-sticky-note"></i> ملاحظات
                </label>
                <textarea name="notes" id="notes" class="form-textarea" rows="3"
                    placeholder="أضف أي ملاحظات إضافية..."></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">
                    <i class="fas fa-save"></i> حفظ التذكير
                </button>
                <button type="button" class="btn-secondary" onclick="closeAddReminderModal()">
                    <i class="fas fa-times"></i> إلغاء
                </button>
            </div>
        </form>
    </div>
</div>

<style>

        backdrop-filter: blur(20px);

    }

    .modal-header {
        padding: 25px 30px;

<script>
    document.addEventListener('DOMContentLoaded', function () {
        loadReminders();
        loadMedications();
        setupEventListeners();
    });

    function setupEventListeners() {
        // Filter tabs
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', function () {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                filterReminders(this.dataset.filter);
            });
        });

        // Search input
        document.getElementById('searchInput').addEventListener('input', function () {
            filterReminders();
        });

        // Add reminder form
        document.getElementById('addReminderForm').addEventListener('submit', function (e) {
            e.preventDefault();
            addReminder();
        });
    }

    function loadReminders() {
        fetch('/api/reminders')
            .then(response => response.json())
            .then(data => {
                displayReminders(data);
            })
            .catch(error => {
                console.error('Error loading reminders:', error);
                showEmptyState();
            });
    }

    function loadMedications() {
        fetch('/api/medications')
            .then(response => response.json())
            .then(data => {
                const select = document.getElementById('medication_id');
                select.innerHTML = '<option value="">اختر الدواء</option>';
                data.forEach(medication => {
                    const option = document.createElement('option');
                    option.value = medication.id;
                    option.textContent = medication.name;
                    select.appendChild(option);
                });
            })
            .catch(error => {
                console.error('Error loading medications:', error);
            });
    }

    function displayReminders(reminders) {
        const container = document.getElementById('remindersList');
        const emptyState = document.getElementById('emptyState');

        if (reminders.length === 0) {
            container.style.display = 'none';
            emptyState.style.display = 'block';
            return;
        }

        container.style.display = 'grid';
        emptyState.style.display = 'none';

        container.innerHTML = reminders.map(reminder => `
        <div class="reminder-item ${getReminderClass(reminder)}" data-reminder-id="${reminder.id}">
            <div class="reminder-header">
                <div class="reminder-info">
                    <h3>${reminder.medication_name}</h3>
                    <p>${reminder.dosage}</p>
                </div>
                <div class="reminder-status status-${reminder.status}">
                    ${getStatusText(reminder.status)}
                </div>
            </div>
            <div class="reminder-details">
                <div class="detail-item">
                    <i class="fas fa-clock"></i>
                    <span>${reminder.time}</span>
                </div>
                <div class="detail-item">
                    <i class="fas fa-calendar"></i>
                    <span>${formatDate(reminder.reminder_time)}</span>
                </div>
                <div class="detail-item">
                    <i class="fas fa-bell"></i>
                    <span>${getNotificationType(reminder.notification_type)}</span>
                </div>
            </div>
            <div class="reminder-actions">
                <button class="btn-action btn-mark-taken" onclick="markAsTaken(${reminder.id})">
                    <i class="fas fa-check"></i> تم التناول
                </button>
                <button class="btn-action btn-snooze" onclick="snoozeReminder(${reminder.id})">
                    <i class="fas fa-clock"></i> تأجيل
                </button>
                <button class="btn-action btn-edit" onclick="editReminder(${reminder.id})">
                    <i class="fas fa-edit"></i> تعديل
                </button>
                <button class="btn-action btn-delete" onclick="deleteReminder(${reminder.id})">
                    <i class="fas fa-trash"></i> حذف
                </button>
            </div>
        </div>
    `).join('');
    }

    function getReminderClass(reminder) {
        const now = new Date();
        const reminderTime = new Date(reminder.reminder_time);

        if (reminderTime < now) {
            return 'overdue';
        } else if (reminderTime.getTime() - now.getTime() < 24 * 60 * 60 * 1000) {
            return 'upcoming';
        }
        return '';
    }

    function getStatusText(status) {
        const statusMap = {
            'pending': 'في الانتظار',
            'sent': 'تم الإرسال',
            'failed': 'فشل الإرسال'
        };
        return statusMap[status] || status;
    }

    function getNotificationType(type) {
        const typeMap = {
            'email': 'البريد الإلكتروني',
            'sms': 'الرسائل النصية',
            'in_app': 'داخل التطبيق'
        };
        return typeMap[type] || type;
    }

    function formatDate(dateString) {
        const date = new Date(dateString);
        return date.toLocaleDateString('ar-SA');
    }

    function filterReminders(filter = 'all') {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const reminderItems = document.querySelectorAll('.reminder-item');

        reminderItems.forEach(item => {
            const reminderText = item.textContent.toLowerCase();
            const matchesSearch = reminderText.includes(searchTerm);

            let matchesFilter = true;
            if (filter !== 'all') {
                matchesFilter = item.classList.contains(filter);
            }

            if (matchesSearch && matchesFilter) {
                item.style.display = 'block';
            } else {
                item.style.display = 'none';
            }
        });
    }

    function showAddReminderModal() {
        document.getElementById('addReminderModal').style.display = 'block';
    }

    function closeAddReminderModal() {
        document.getElementById('addReminderModal').style.display = 'none';
        document.getElementById('addReminderForm').reset();
    }

    function addReminder() {
        const formData = new FormData(document.getElementById('addReminderForm'));
        const notificationMethods = Array.from(document.querySelectorAll('input[name="notification_methods"]:checked'))
            .map(input => input.value);

        const reminderData = {
            medication_id: formData.get('medication_id'),
            reminder_type: formData.get('reminder_type'),
            reminder_time: formData.get('reminder_time'),
            reminder_frequency: formData.get('reminder_frequency'),
            notification_methods: notificationMethods,
            notes: formData.get('notes')
        };

        fetch('/api/reminders', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(reminderData)
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    closeAddReminderModal();
                    loadReminders();
                    showNotification('تم إضافة التذكير بنجاح', 'success');
                } else {
                    showNotification('فشل في إضافة التذكير', 'error');
                }
            })
            .catch(error => {
                console.error('Error adding reminder:', error);
                showNotification('حدث خطأ أثناء إضافة التذكير', 'error');
            });
    }

    function markAsTaken(reminderId) {
        if (confirm('هل تم تناول الدواء؟')) {
            fetch(`/api/reminders/${reminderId}/mark-taken`, {
                method: 'POST'
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        loadReminders();
                        showNotification('تم تسجيل تناول الدواء', 'success');
                    } else {
                        showNotification('فشل في تسجيل تناول الدواء', 'error');
                    }
                })
                .catch(error => {
                    console.error('Error marking as taken:', error);
                    showNotification('حدث خطأ أثناء تسجيل تناول الدواء', 'error');
                });
        }
    }

    function snoozeReminder(reminderId) {
        const minutes = prompt('كم دقيقة تريد تأجيل التذكير؟', '15');
        if (minutes && !isNaN(minutes)) {
            fetch(`/api/reminders/${reminderId}/snooze`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ minutes: parseInt(minutes) })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        loadReminders();
                        showNotification('تم تأجيل التذكير', 'success');
                    } else {
                        showNotification('فشل في تأجيل التذكير', 'error');
                    }
                })
                .catch(error => {
                    console.error('Error snoozing reminder:', error);
                    showNotification('حدث خطأ أثناء تأجيل التذكير', 'error');
                });
        }
    }

    function editReminder(reminderId) {
        // في التطبيق الحقيقي، ستقوم بفتح modal التعديل
        showNotification('ميزة التعديل قيد التطوير', 'info');
    }

    function deleteReminder(reminderId) {
        if (confirm('هل أنت متأكد من حذف هذا التذكير؟')) {
            fetch(`/api/reminders/${reminderId}`, {
                method: 'DELETE'
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        loadReminders();
                        showNotification('تم حذف التذكير', 'success');
                    } else {
                        showNotification('فشل في حذف التذكير', 'error');
                    }
                })
                .catch(error => {
                    console.error('Error deleting reminder:', error);
                    showNotification('حدث خطأ أثناء حذف التذكير', 'error');
                });
        }
    }

    function showEmptyState() {
        document.getElementById('remindersList').style.display = 'none';
        document.getElementById('emptyState').style.display = 'block';
    }

    function showNotification(message, type) {
        // في التطبيق الحقيقي، ستقوم بعرض إشعار
        alert(message);
    }

    // إغلاق الـ modal عند النقر خارجه
    window.onclick = function (event) {
        const modal = document.getElementById('addReminderModal');
        if (event.target === modal) {
            closeAddReminderModal();
        }
    }
</script>
{% endblock %}
