{% extends "base.html" %}

{% block title %}إعدادات الحساب - دوائي{% endblock %}

{% block content %}
<div class="account-settings-container">
    <div class="page-header">
        <h1><i class="fas fa-user-cog"></i> إعدادات الحساب</h1>
        <p>إدارة معلوماتك الشخصية وإعدادات الحساب</p>
    </div>

    <div class="settings-container">
        <form method="POST" class="account-form" enctype="multipart/form-data">
            <div class="settings-section">
                <h3><i class="fas fa-user"></i> المعلومات الشخصية</h3>

                <div class="profile-picture-section">
                    <div class="profile-picture">
                        <img id="profileImage"
                            src="{{ current_user.profile_picture or '/static/images/default-avatar.png' }}"
                            alt="صورة الملف الشخصي">
                        <div class="upload-overlay">
                            <i class="fas fa-camera"></i>
                        </div>
                    </div>
                    <div class="upload-controls">
                        <input type="file" id="profileImageInput" name="profile_picture" accept="image/*"
                            style="display: none;">
                        <button type="button" class="btn-upload"
                            onclick="document.getElementById('profileImageInput').click()">
                            <i class="fas fa-upload"></i> تغيير الصورة
                        </button>
                        <button type="button" class="btn-remove" onclick="removeProfilePicture()">
                            <i class="fas fa-trash"></i> إزالة الصورة
                        </button>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="first_name" class="form-label">
                            <i class="fas fa-user"></i> الاسم الأول
                        </label>
                        <input type="text" name="first_name" id="first_name" class="form-input"
                            value="{{ current_user.first_name or '' }}" placeholder="أدخل اسمك الأول" required>
                    </div>

                    <div class="form-group">
                        <label for="last_name" class="form-label">
                            <i class="fas fa-user"></i> اسم العائلة
                        </label>
                        <input type="text" name="last_name" id="last_name" class="form-input"
                            value="{{ current_user.last_name or '' }}" placeholder="أدخل اسم العائلة" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope"></i> البريد الإلكتروني
                    </label>
                    <input type="email" name="email" id="email" class="form-input"
                        value="{{ current_user.email or '' }}" placeholder="أدخل بريدك الإلكتروني" required>
                </div>

                <div class="form-group">
                    <label for="phone" class="form-label">
                        <i class="fas fa-phone"></i> رقم الهاتف
                    </label>
                    <input type="tel" name="phone" id="phone" class="form-input" value="{{ current_user.phone or '' }}"
                        placeholder="أدخل رقم هاتفك">
                </div>

                <div class="form-group">
                    <label for="date_of_birth" class="form-label">
                        <i class="fas fa-calendar"></i> تاريخ الميلاد
                    </label>
                    <input type="date" name="date_of_birth" id="date_of_birth" class="form-input"
                        value="{{ current_user.date_of_birth or '' }}">
                </div>

                <div class="form-group">
                    <label for="gender" class="form-label">
                        <i class="fas fa-venus-mars"></i> الجنس
                    </label>
                    <select name="gender" id="gender" class="form-input">
                        <option value="">اختر الجنس</option>
                        <option value="male" {% if current_user.gender=='male' %}selected{% endif %}>ذكر</option>
                        <option value="female" {% if current_user.gender=='female' %}selected{% endif %}>أنثى</option>
                    </select>
                </div>
            </div>

            <div class="settings-section">
                <h3><i class="fas fa-map-marker-alt"></i> العنوان</h3>

                <div class="form-group">
                    <label for="address" class="form-label">
                        <i class="fas fa-home"></i> العنوان الكامل
                    </label>
                    <textarea name="address" id="address" class="form-textarea" placeholder="أدخل عنوانك الكامل"
                        rows="3">{{ current_user.address or '' }}</textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="city" class="form-label">
                            <i class="fas fa-city"></i> المدينة
                        </label>
                        <input type="text" name="city" id="city" class="form-input"
                            value="{{ current_user.city or '' }}" placeholder="أدخل مدينتك">
                    </div>

                    <div class="form-group">
                        <label for="state" class="form-label">
                            <i class="fas fa-map"></i> المحافظة
                        </label>
                        <input type="text" name="state" id="state" class="form-input"
                            value="{{ current_user.state or '' }}" placeholder="أدخل محافظتك">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="postal_code" class="form-label">
                            <i class="fas fa-mail-bulk"></i> الرمز البريدي
                        </label>
                        <input type="text" name="postal_code" id="postal_code" class="form-input"
                            value="{{ current_user.postal_code or '' }}" placeholder="أدخل الرمز البريدي">
                    </div>

                    <div class="form-group">
                        <label for="country" class="form-label">
                            <i class="fas fa-flag"></i> البلد
                        </label>
                        <select name="country" id="country" class="form-input">
                            <option value="">اختر البلد</option>
                            <option value="SA" {% if current_user.country=='SA' %}selected{% endif %}>السعودية</option>
                            <option value="AE" {% if current_user.country=='AE' %}selected{% endif %}>الإمارات</option>
                            <option value="KW" {% if current_user.country=='KW' %}selected{% endif %}>الكويت</option>
                            <option value="QA" {% if current_user.country=='QA' %}selected{% endif %}>قطر</option>
                            <option value="BH" {% if current_user.country=='BH' %}selected{% endif %}>البحرين</option>
                            <option value="OM" {% if current_user.country=='OM' %}selected{% endif %}>عمان</option>
                            <option value="JO" {% if current_user.country=='JO' %}selected{% endif %}>الأردن</option>
                            <option value="LB" {% if current_user.country=='LB' %}selected{% endif %}>لبنان</option>
                            <option value="EG" {% if current_user.country=='EG' %}selected{% endif %}>مصر</option>
                            <option value="MA" {% if current_user.country=='MA' %}selected{% endif %}>المغرب</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="settings-section">
                <h3><i class="fas fa-heart"></i> المعلومات الطبية</h3>

                <div class="form-group">
                    <label for="blood_type" class="form-label">
                        <i class="fas fa-tint"></i> فصيلة الدم
                    </label>
                    <select name="blood_type" id="blood_type" class="form-input">
                        <option value="">اختر فصيلة الدم</option>
                        <option value="A+" {% if current_user.blood_type=='A+' %}selected{% endif %}>A+</option>
                        <option value="A-" {% if current_user.blood_type=='A-' %}selected{% endif %}>A-</option>
                        <option value="B+" {% if current_user.blood_type=='B+' %}selected{% endif %}>B+</option>
                        <option value="B-" {% if current_user.blood_type=='B-' %}selected{% endif %}>B-</option>
                        <option value="AB+" {% if current_user.blood_type=='AB+' %}selected{% endif %}>AB+</option>
                        <option value="AB-" {% if current_user.blood_type=='AB-' %}selected{% endif %}>AB-</option>
                        <option value="O+" {% if current_user.blood_type=='O+' %}selected{% endif %}>O+</option>
                        <option value="O-" {% if current_user.blood_type=='O-' %}selected{% endif %}>O-</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="allergies" class="form-label">
                        <i class="fas fa-exclamation-triangle"></i> الحساسية
                    </label>
                    <textarea name="allergies" id="allergies" class="form-textarea"
                        placeholder="اذكر أي حساسية تعاني منها (مثل: البنسلين، المكسرات، إلخ)"
                        rows="3">{{ current_user.allergies or '' }}</textarea>
                </div>

                <div class="form-group">
                    <label for="medical_conditions" class="form-label">
                        <i class="fas fa-stethoscope"></i> الحالات الطبية
                    </label>
                    <textarea name="medical_conditions" id="medical_conditions" class="form-textarea"
                        placeholder="اذكر أي حالات طبية مزمنة (مثل: السكري، الضغط، إلخ)"
                        rows="3">{{ current_user.medical_conditions or '' }}</textarea>
                </div>

                <div class="form-group">
                    <label for="emergency_contact" class="form-label">
                        <i class="fas fa-phone-alt"></i> جهة الاتصال في الطوارئ
                    </label>
                    <input type="text" name="emergency_contact" id="emergency_contact" class="form-input"
                        value="{{ current_user.emergency_contact or '' }}"
                        placeholder="اسم ورقم هاتف جهة الاتصال في الطوارئ">
                </div>
            </div>

            <div class="settings-section">
                <h3><i class="fas fa-language"></i> إعدادات اللغة والمنطقة</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label for="language" class="form-label">
                            <i class="fas fa-globe"></i> اللغة
                        </label>
                        <select name="language" id="language" class="form-input">
                            <option value="ar" {% if current_user.language=='ar' %}selected{% endif %}>العربية</option>
                            <option value="en" {% if current_user.language=='en' %}selected{% endif %}>English</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="timezone" class="form-label">
                            <i class="fas fa-clock"></i> المنطقة الزمنية
                        </label>
                        <select name="timezone" id="timezone" class="form-input">
                            <option value="Asia/Riyadh" {% if current_user.timezone=='Asia/Riyadh' %}selected{% endif
                                %}>الرياض (GMT+3)</option>
                            <option value="Asia/Dubai" {% if current_user.timezone=='Asia/Dubai' %}selected{% endif %}>
                                دبي (GMT+4)</option>
                            <option value="Asia/Kuwait" {% if current_user.timezone=='Asia/Kuwait' %}selected{% endif
                                %}>الكويت (GMT+3)</option>
                            <option value="Asia/Qatar" {% if current_user.timezone=='Asia/Qatar' %}selected{% endif %}>
                                الدوحة (GMT+3)</option>
                            <option value="Asia/Bahrain" {% if current_user.timezone=='Asia/Bahrain' %}selected{% endif
                                %}>المنامة (GMT+3)</option>
                            <option value="Asia/Muscat" {% if current_user.timezone=='Asia/Muscat' %}selected{% endif
                                %}>مسقط (GMT+4)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="date_format" class="form-label">
                        <i class="fas fa-calendar-alt"></i> تنسيق التاريخ
                    </label>
                    <select name="date_format" id="date_format" class="form-input">
                        <option value="dd/mm/yyyy" {% if current_user.date_format=='dd/mm/yyyy' %}selected{% endif %}>
                            يوم/شهر/سنة</option>
                        <option value="mm/dd/yyyy" {% if current_user.date_format=='mm/dd/yyyy' %}selected{% endif %}>
                            شهر/يوم/سنة</option>
                        <option value="yyyy-mm-dd" {% if current_user.date_format=='yyyy-mm-dd' %}selected{% endif %}>
                            سنة-شهر-يوم</option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">
                    <i class="fas fa-save"></i> حفظ التغييرات
                </button>
                <a href="{{ url_for('profile') }}" class="btn-secondary">
                    <i class="fas fa-arrow-right"></i> العودة للملف الشخصي
                </a>
            </div>
        </form>
    </div>
</div>

<style>
    .account-settings-container {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
        min-height: 100vh;
    }

    .page-header {
        background: var(--bg-glass);
        padding: 30px;
        border-radius: 15px;
        box-shadow: var(--shadow-lg);
        margin-bottom: 30px;
        text-align: center;
        backdrop-filter: blur(20px);
        border: 1px solid rgba(0, 191, 166, 0.2);
    }

    .page-header h1 {
        margin: 0 0 10px 0;
        color: var(--text-primary);
        font-size: 2.2em;
        font-weight: 700;
    }

    .page-header p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 1.1em;
    }

    .page-header i {
        margin-left: 10px;
        color: var(--primary-color);
    }

    .settings-container {
        background: var(--bg-glass);
        border-radius: 15px;
        box-shadow: var(--shadow-lg);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(0, 191, 166, 0.2);
        overflow: hidden;
    }

    .settings-section {
        padding: 30px;
        border-bottom: 1px solid rgba(0, 191, 166, 0.2);
    }

    .settings-section:last-child {
        border-bottom: none;
    }

    .settings-section h3 {
        margin: 0 0 25px 0;
        color: var(--text-primary);
        font-size: 1.4em;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .settings-section h3 i {
        color: var(--primary-color);
    }

    .profile-picture-section {
        display: flex;
        align-items: center;
        gap: 30px;
        margin-bottom: 30px;
        padding: 20px;
        background: var(--bg-secondary);
        border-radius: 10px;
        border: 1px solid rgba(0, 191, 166, 0.1);
    }

    .profile-picture {
        position: relative;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        overflow: hidden;
        border: 4px solid var(--primary-color);
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .profile-picture:hover {
        transform: scale(1.05);
        box-shadow: var(--shadow-lg);
    }

    .profile-picture img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .upload-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: all 0.3s ease;
    }

    .profile-picture:hover .upload-overlay {
        opacity: 1;
    }

    .upload-overlay i {
        color: white;
        font-size: 2em;
    }

    .upload-controls {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .btn-upload,
    .btn-remove {
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .btn-upload {
        background: var(--primary-color);
        color: white;
    }

    .btn-upload:hover {
        background: var(--secondary-color);
    }

    .btn-remove {
        background: #dc3545;
        color: white;
    }

    .btn-remove:hover {
        background: #c82333;
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-label {
        display: block;
        margin-bottom: 8px;
        color: var(--text-primary);
        font-weight: 600;
        font-size: 1em;
    }

    .form-label i {
        margin-left: 8px;
        color: var(--primary-color);
    }

    .form-input,
    .form-textarea {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid rgba(0, 191, 166, 0.3);
        border-radius: 8px;
        font-size: 16px;
        transition: all 0.3s ease;
        box-sizing: border-box;
        background: var(--bg-secondary);
        color: var(--text-primary);
        font-family: inherit;
    }

    .form-input:focus,
    .form-textarea:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(0, 191, 166, 0.1);
    }

    .form-textarea {
        resize: vertical;
        min-height: 80px;
    }

    .form-actions {
        padding: 30px;
        background: var(--bg-secondary);
        display: flex;
        gap: 15px;
        justify-content: center;
    }

    .btn-primary {
        background: var(--primary-color);
        color: white;
        padding: 15px 30px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .btn-primary:hover {
        background: var(--secondary-color);
        transform: translateY(-2px);
        box-shadow: var(--shadow-lg);
    }

    .btn-secondary {
        background: var(--bg-card);
        color: var(--text-primary);
        padding: 15px 30px;
        text-decoration: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 2px solid rgba(0, 191, 166, 0.3);
    }

    .btn-secondary:hover {
        background: var(--bg-glass);
        transform: translateY(-2px);
        box-shadow: var(--shadow-lg);
    }

    @media (max-width: 768px) {
        .account-settings-container {
            padding: 15px;
        }

        .settings-section {
            padding: 20px;
        }

        .profile-picture-section {
            flex-direction: column;
            text-align: center;
            gap: 20px;
        }

        .form-row {
            grid-template-columns: 1fr;
        }

        .form-actions {
            flex-direction: column;
            padding: 20px;
        }

        .btn-primary,
        .btn-secondary {
            width: 100%;
            justify-content: center;
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const profileImageInput = document.getElementById('profileImageInput');
        const profileImage = document.getElementById('profileImage');

        profileImageInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    profileImage.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
    });

    function removeProfilePicture() {
        if (confirm('هل أنت متأكد من إزالة صورة الملف الشخصي؟')) {
            document.getElementById('profileImage').src = '/static/images/default-avatar.png';
            document.getElementById('profileImageInput').value = '';
        }
    }
</script>
{% endblock %}
